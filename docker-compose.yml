services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: devmgmt
      POSTGRES_PASSWORD: devmgmt
      POSTGRES_DB: devmgmt
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6380:6379"
volumes:
  pgdata:
