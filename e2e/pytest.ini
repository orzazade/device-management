[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -ra --strict-markers --tb=short
markers =
    smoke: core paths that must never break
    auth: sign-in, sign-out, password rules
    rbac: role-based access to pages and nav
    crud: create/read/update flows for devices, users, projects
    lifecycle: the full request -> approve -> handover -> return loan flow
    validation: client-side form validation and error messages
