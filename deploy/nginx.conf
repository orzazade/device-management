server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client router owns unknown paths.
    # /api never reaches nginx: Traefik routes it to the api service.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
