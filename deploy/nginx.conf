server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints everything under /assets, so those files can be
    # cached forever — a new build always ships new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must be re-checked on every load, or browsers keep an old
    # shell pointing at old bundles for hours after a deploy. The ETag keeps
    # the re-check to a cheap 304.
    # SPA fallback — client router owns unknown paths.
    # /api never reaches nginx: Traefik routes it to the api service.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
