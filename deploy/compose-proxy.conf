# Local-only reverse proxy for the `full` compose profile.
#
# The web app calls the API on the same origin under /api (see
# apps/web/src/lib/api.ts), so running the two containers side by side is not
# enough — something has to put them on one origin. In production that is
# Traefik / an OpenShift Route; here it is this container, doing exactly the
# same two routing rules so local behaviour matches the cluster.
#
# This file is NOT baked into any image. It is mounted by docker-compose.yml.

upstream api_upstream {
    server api:8080;
}

upstream web_upstream {
    server web:80;
}

server {
    listen 80;

    # Excel import posts multipart bodies; the API caps them at 10 MB
    # (main.ts). nginx defaults to 1 MB, which would reject a valid import
    # here but not in production — leave headroom so the two agree.
    client_max_body_size 12m;

    # No trailing path on proxy_pass: the original URI is forwarded intact,
    # so /api/v1/health reaches the API's global prefix unchanged.
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
